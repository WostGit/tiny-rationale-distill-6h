name: run-6h-study

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-grid-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: [arithmetic, symbolic]
        supervision: [answer_only, short_rationale, full_rationale]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate symbolic data
        run: |
          python scripts/generate_symbolic_data.py --output_dir data --train_size 256 --eval_size 128 --seed 17

      - name: Run shard study
        env:
          TASK: ${{ matrix.task }}
          SUP: ${{ matrix.supervision }}
        run: |
          python scripts/run_6h_study.py \
            --tasks "$TASK" \
            --supervision_formats "$SUP" \
            --budgets "16,32,64,128" \
            --seeds "11,12,13,14,15" \
            --epochs 3 \
            --batch_size 8 \
            --output_root outputs/metrics

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.task }}-${{ matrix.supervision }}
          path: outputs/metrics
